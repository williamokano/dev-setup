# Global npm packages go into the user-owned mise Node.js prefix — no root
- name: Install Gemini CLI globally
  become: false
  npm:
    name: "@google/gemini-cli"
    global: true
    state: present
    executable: "{{ npm_bin | default(user_home ~ '/.local/share/mise/shims/npm') }}"
  tags:
    - gemini

# Make the newly installed CLI's binary available through mise shims
- name: Refresh mise shims
  become: false
  command: mise reshim
  changed_when: false
  tags:
    - gemini
