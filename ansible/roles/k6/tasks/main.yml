- name: "Check if k6 {{ k6_version }} is installed via mise"
  become: false
  command: "mise where k6@{{ k6_version }}"
  register: mise_k6_where
  changed_when: false
  failed_when: false
  tags: [k6]

# Installs k6 if missing and makes it the global default; projects
# can override with their own .mise.toml / .tool-versions
- name: "Set k6 {{ k6_version }} as global default via mise"
  become: false
  command: "mise use --global k6@{{ k6_version }}"
  changed_when: mise_k6_where.rc != 0
  tags: [k6]

- name: Set k6 binary path (mise shim)
  set_fact:
    k6_bin: "{{ user_home }}/.local/share/mise/shims/k6"
  tags: [k6]

- name: Verify k6 version
  become: false
  command: "{{ k6_bin }} version"
  register: k6_version_check
  changed_when: false
  tags: [k6]

- name: Debug installed k6 version
  debug:
    msg: "Installed k6 version: {{ k6_version_check.stdout }}"
  tags: [k6]
