# deb822_repository needs python3-debian on the host
- name: Install required packages
  become: true
  apt:
    name:
      - ca-certificates
      - curl
      - python3-debian
    state: present
    update_cache: yes

- name: Add NodeSource Node.js {{ nodejs_version }} repo
  become: true
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: "https://deb.nodesource.com/node_{{ nodejs_version }}.x"
    suites: nodistro
    components: main
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present

- name: Remove legacy nodesource apt source and keyring
  become: true
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/nodesource.list
    - /usr/share/keyrings/nodesource.gpg

- name: Install Node.js
  become: true
  apt:
    name: nodejs
    state: present
    update_cache: yes
