- name: Install tmux plugin manager (TPM)
  become: false
  git:
    repo: https://github.com/tmux-plugins/tpm
    dest: "{{ user_home }}/.tmux/plugins/tpm"
    update: yes
  tags:
    - terminal
    - tmux

# The tmux config must be in place before TPM runs — install_plugins reads
# the plugin list from .tmux.conf
- name: Stow terminal dotfiles
  become: false
  command: "stow -t {{ user_home }} {{ item }}"
  args:
    chdir: "{{ dotfiles_dir }}"
  loop:
    - alacritty
    - tmux
  changed_when: false
  tags:
    - terminal
    - stow

- name: Install tmux plugins via TPM (non-interactive)
  become: false
  command: "{{ user_home }}/.tmux/plugins/tpm/bin/install_plugins"
  environment:
    TMUX_PLUGIN_MANAGER_PATH: "{{ user_home }}/.tmux/plugins"
  register: tpm_install
  changed_when: "'Installing' in tpm_install.stdout"
  tags:
    - terminal
    - tmux
    - tpm